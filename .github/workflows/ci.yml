name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, unit, API and quality-gate tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m spacy download en_core_web_sm
      - name: Lint
        run: ruff check .
      - name: Tests (no API key needed, no credits spent)
        run: pytest -v
      - name: Evaluation report
        run: python scripts/run_eval.py --no-save
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: reports/

  e2e:
    name: Browser tests (Playwright + Streamlit)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m spacy download en_core_web_sm
          playwright install --with-deps chromium
      - name: End-to-end tests
        run: pytest -m e2e -v
